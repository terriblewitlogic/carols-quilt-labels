<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library Builder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Iowan Old Style", Georgia, serif;
    background: #1A1410; color: #E8E0D4;
    min-height: 100vh; overflow-x: hidden;
  }
  /* ── Top bar ── */
  #topbar {
    position: sticky; top: 0; z-index: 50;
    background: #110E0B; border-bottom: 1px solid #2E2820;
    display: flex; align-items: center; gap: 12; padding: 0 20px; height: 50px;
    flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; font-weight: 700; color: #D4A060; flex-shrink: 0; }
  #stats { font-size: 11px; color: #6B5D50; flex-shrink: 0; }
  #topbar .gap { flex: 1; }
  .topbtn {
    padding: 6px 14px; border-radius: 5px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: none; font-family: inherit; letter-spacing: 0.03em;
  }
  #btnAutoAll  { background: #D4A060; color: #110E0B; }
  #btnStopAll  { background: #5A2020; color: #E8C0A0; display: none; }
  #btnReload   { background: #1C1712; color: #9A8A78; border: 1px solid #2E2820; }
  .progress-bar {
    height: 2px; background: #2E2820; flex-shrink: 0; width: 120px;
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: #D4A060; transition: width 0.3s; }

  /* ── Tabs ── */
  #tabs {
    display: flex; gap: 2px; padding: 10px 20px 0;
    background: #110E0B; border-bottom: 1px solid #2E2820; flex-wrap: wrap;
  }
  .tab {
    padding: 7px 13px; font-size: 12px; cursor: pointer;
    border: none; border-radius: 4px 4px 0 0; font-family: inherit;
    background: transparent; color: #6B5D50; transition: color 0.12s;
  }
  .tab.active { background: #1A1410; color: #D4A060; font-weight: 600; }

  /* ── Grid ── */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px; padding: 20px;
  }

  /* ── Card ── */
  .card {
    background: #110E0B; border: 1px solid #2E2820; border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #4A3E34; }
  .card.state-saved { border-color: #1A3A1A; }
  .card.state-error { border-color: #5A2020; }

  .card-header {
    padding: 10px 12px 6px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 6px;
  }
  .card-name { font-size: 13px; font-weight: 600; color: #D4C4B0; }
  .card-desc { font-size: 11px; color: #6B5D50; padding: 0 12px 8px; line-height: 1.45; }

  .badge {
    font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; font-weight: 600; flex-shrink: 0;
    white-space: nowrap;
  }
  .badge-saved    { background: #1A3A1A; color: #6A9A6A; }
  .badge-pending  { background: #1E1A16; color: #4A3E34; }
  .badge-running  { background: #2A200E; color: #C07A30; }
  .badge-error    { background: #2A1212; color: #C07070; }

  /* Preview area */
  .card-preview {
    display: flex; gap: 0; border-top: 1px solid #1E1A16; border-bottom: 1px solid #1E1A16;
    min-height: 0;
  }
  .preview-half {
    flex: 1; aspect-ratio: 1; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #0C0A08;
  }
  .preview-half:first-child { border-right: 1px solid #1E1A16; }
  .preview-half img, .preview-half svg { max-width: 100%; max-height: 100%; display: block; }
  .preview-half .ph {
    font-size: 28px; opacity: 0.15; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .preview-half .ph-label { font-size: 9px; color: #3A3028; text-transform: uppercase; letter-spacing: 0.1em; }
  .preview-half .spinner {
    width: 20px; height: 20px; border: 2px solid #2E2820;
    border-top-color: #D4A060; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-half .step-label {
    position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
    font-size: 9px; color: #6B5D50; letter-spacing: 0.08em;
  }

  /* Meta row */
  .card-meta {
    padding: 6px 12px; display: flex; gap: 8px; flex-wrap: wrap;
    font-size: 10px; color: #4A3E34; border-bottom: 1px solid #1E1A16;
  }
  .card-meta span { display: flex; align-items: center; gap: 3px; }

  /* Actions */
  .card-actions { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card-msg { font-size: 10px; color: #6A9A6A; line-height: 1.5; }
  .card-err { font-size: 10px; color: #C07070; line-height: 1.5; }

  .abtn {
    width: 100%; padding: 7px 0; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: none; font-family: inherit; letter-spacing: 0.05em;
    text-transform: uppercase; transition: opacity 0.1s;
  }
  .abtn:disabled { opacity: 0.4; cursor: not-allowed; }
  .abtn-primary   { background: #D4A060; color: #110E0B; }
  .abtn-secondary { background: #1C1712; color: #9A8A78; border: 1px solid #2E2820; }
  .abtn-success   { background: #1A3A1A; color: #6A9A6A; border: 1px solid #2E4A2E; }
  .abtn-warn      { background: #2A200E; color: #C07A30; border: 1px solid #4A3010; }
  .abtn-row       { display: flex; gap: 6px; }
  .abtn-row .abtn { flex: 1; }

  /* Stitch count chip */
  .stitch-chip { font-size: 10px; color: #4A3E34; margin-left: auto; align-self: center; }
</style>
</head>
<body>

<!-- ── Top bar ── -->
<div id="topbar">
  <h1>📚 Library Builder</h1>
  <span id="stats">Loading…</span>
  <div class="gap"></div>

    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <button class="topbtn" id="btnAutoAll"  onclick="startAutoQueue()">⚡ Auto-Generate All</button>
  <button class="topbtn" id="btnStopAll"  onclick="stopQueue()">■ Stop</button>
  <button class="topbtn" id="btnReload"   onclick="reloadManifest()">↺ Refresh</button>

<!-- ── Category tabs ── -->
<div id="tabs"></div>

  { id:'otomi-deer',         name:'Otomí Deer',               category:'folk-art',      description:'Mexican Otomí embroidery style deer with flowers',                prompt:'a deer in Mexican Otomí embroidery style facing forward, bilateral symmetric with identical stylised flowers on each side in red and pink, matching blue and green leaf motifs arranged symmetrically, bold outline, centered on white',                                                                                                                                                  settings:{hoopKey:'4x4',numColors:6,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  // Geometric
  { id:'mandala',            name:'Mandala',                  category:'geometric',     description:'Eight-fold mandala in indigo and gold',                           prompt:'a perfectly eight-fold radially symmetric mandala with identical geometric petal shapes repeating eight times, deep indigo and medium indigo with gold accents, bold clean lines, centered on white',                                                                                                                                                                              settings:{hoopKey:'4x4',numColors:4,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'hex-grid',           name:'Honeycomb',                category:'geometric',     description:'Interlocking hexagons in amber and honey tones',                  prompt:'a honeycomb pattern of perfectly uniform interlocking regular hexagons arranged in a tight symmetric grid, alternating amber and gold fill, simple and bold, centered on white',                                                                                                                                                                                                  settings:{hoopKey:'4x4',numColors:3,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'star-burst',         name:'Eight-Pointed Star',       category:'geometric',     description:'Classic eight-pointed star with radiating points',                prompt:'a bold perfectly eight-fold radially symmetric eight-pointed star with identical alternating long and short points in deep teal and cream, centered on white',                                                                                                                                                                                                                     settings:{hoopKey:'4x4',numColors:3,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'celtic-knot',        name:'Celtic Knot',              category:'geometric',     description:'Interlaced Celtic trinity knot in forest green',                  prompt:'a Celtic trinity knot in a perfect circle with three identical interlaced bands of equal width in forest green with a thin gold outline, three-fold radially symmetric, centered on white',                                                                                                                                                                                       settings:{hoopKey:'4x4',numColors:3,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'diamond-grid',       name:'Diamond Lattice',          category:'geometric',     description:'Repeating diamond lattice in navy and white',                     prompt:'a perfectly repeating diamond lattice pattern of uniform identical diamonds in navy blue and white with small gold dot accents at every intersection, centered on white',                                                                                                                                                                                                           settings:{hoopKey:'4x4',numColors:3,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'pinwheel',           name:'Pinwheel',                 category:'geometric',     description:'Four-blade pinwheel in bright primary colours',                   prompt:'a four-blade pinwheel with four identical blades of equal size alternating red and blue arranged with perfect four-fold rotational symmetry around a yellow circular centre, centered on white',                                                                                                                                                                                    settings:{hoopKey:'4x4',numColors:4,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
  { id:'compass-rose',       name:'Compass Rose',             category:'geometric',     description:'Nautical compass rose in navy and gold',                          prompt:'a nautical compass rose with sixteen identical sharp points arranged with perfect sixteen-fold radial symmetry alternating navy blue and gold, centered on white',                                                                                                                                                                                                                 settings:{hoopKey:'4x4',numColors:3,densityMm:0.4,outline:'running',minFeatureMm:1.5}},
];

const CATEGORY_ICON = Object.fromEntries(CATEGORIES.map(c => [c.id, c.icon]));

// ─── App state ────────────────────────────────────────────────────────────────
let manifest = {};   // id → meta
let cardState = {};  // id → { stage, imageB64, result, error }
let activeTab = 'all';
let queue = [];
let queueRunning = false;

// stage: 'idle' | 'generating' | 'converting' | 'ready' | 'saving' | 'saved' | 'error'

async function init() {
  buildTabs();
  for (const e of CATALOG) cardState[e.id] = { stage: 'idle', imageB64: null, result: null, error: null };
  await reloadManifest();
  renderGrid();
}

async function reloadManifest() {
  try {
    const r = await fetch('/library/manifest.json?_=' + Date.now());
    const arr = await r.json();
    manifest = {};
    for (const m of arr) manifest[m.id] = m;
  } catch { manifest = {}; }
  // Mark already-saved items
  for (const e of CATALOG) {
    if (manifest[e.id] && cardState[e.id].stage !== 'generating' && cardState[e.id].stage !== 'converting') {
      cardState[e.id].stage = 'saved';
    }
  }
  updateStats();
}

function updateStats() {
  const total = CATALOG.length;
  const saved = CATALOG.filter(e => cardState[e.id]?.stage === 'saved').length;
  document.getElementById('stats').textContent = `${saved} / ${total} generated`;
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function buildTabs() {
  const el = document.getElementById('tabs');
  const tabs = [{ id: 'all', label: 'All', icon: '✦' }, ...CATEGORIES];
  el.innerHTML = tabs.map(t =>
    `<button class="tab${t.id === activeTab ? ' active' : ''}" onclick="setTab('${t.id}')">${t.icon} ${t.label}</button>`
  ).join('');
}

function setTab(id) {
  activeTab = id;
  buildTabs();
  renderGrid();
}

// ─── Grid render ──────────────────────────────────────────────────────────────
function renderGrid() {
  const filtered = activeTab === 'all' ? CATALOG : CATALOG.filter(e => e.category === activeTab);
  // Saved last so unsaved/in-progress come first
  const sorted = [...filtered].sort((a, b) => {
    const aS = cardState[a.id]?.stage === 'saved';
    const bS = cardState[b.id]?.stage === 'saved';
    return aS === bS ? 0 : bS ? -1 : 1;
  });
  document.getElementById('grid').innerHTML = sorted.map(e => cardHTML(e)).join('');
}

function cardHTML(entry) {
  const st = cardState[entry.id];
  const hoop = HOOPS[entry.settings.hoopKey] || HOOPS['4x4'];
  const icon = CATEGORY_ICON[entry.category] || '🪡';

  let badgeClass = 'badge-pending', badgeText = 'Not generated';
  if (st.stage === 'saved')      { badgeClass = 'badge-saved';   badgeText = 'Saved ✓'; }
  if (st.stage === 'generating') { badgeClass = 'badge-running'; badgeText = 'Generating…'; }
  if (st.stage === 'converting') { badgeClass = 'badge-running'; badgeText = 'Converting…'; }
  if (st.stage === 'saving')     { badgeClass = 'badge-running'; badgeText = 'Saving…'; }
  if (st.stage === 'ready')      { badgeClass = 'badge-running'; badgeText = 'Ready to save'; }
  if (st.stage === 'error')      { badgeClass = 'badge-error';   badgeText = 'Error'; }

  const cardClass = st.stage === 'saved' ? 'card state-saved' : st.stage === 'error' ? 'card state-error' : 'card';

  // Preview area
  let leftContent = `<div class="ph"><span>${icon}</span><span class="ph-label">Image</span></div>`;
  let rightContent = `<div class="ph"><span>🪡</span><span class="ph-label">Stitches</span></div>`;

  if (st.stage === 'generating') {
    leftContent = `<div class="spinner"></div><div class="step-label">Generating image…</div>`;
  } else if (st.imageB64) {
    leftContent = `<img src="data:image/png;base64,${st.imageB64}" alt="generated" />`;
  }

  if (st.stage === 'converting') {
    rightContent = `<div class="spinner"></div><div class="step-label">Converting stitches…</div>`;
  } else if (st.result?.previewSvg) {
    rightContent = st.result.previewSvg;
  } else if (st.stage === 'saved') {
    rightContent = `<img src="/library/${entry.id}/preview.svg" alt="preview" onerror="this.style.display='none'" />`;
  }

  // Actions
  let actionsHTML = '';
  const stitchInfo = st.result ? `<span class="stitch-chip">${(st.result.stitchCount/1000).toFixed(1)}k stitches</span>` : '';

  if (st.stage === 'idle' || st.stage === 'error') {
    actionsHTML = `
      ${st.error ? `<div class="card-err">${escHtml(st.error)}</div>` : ''}
      <button class="abtn abtn-primary" onclick="runPipeline('${entry.id}')">▶ Generate &amp; Convert</button>
    `;
  } else if (st.stage === 'generating' || st.stage === 'converting' || st.stage === 'saving') {
    actionsHTML = `<button class="abtn abtn-secondary" disabled>Working…</button>`;
  } else if (st.stage === 'ready') {
    actionsHTML = `
      <div class="abtn-row">
        <button class="abtn abtn-warn" onclick="regenerate('${entry.id}')">↺ Retry</button>
        <button class="abtn abtn-success" onclick="doSave('${entry.id}')">✓ Save</button>
      </div>
      ${stitchInfo}
    `;
  } else if (st.stage === 'saved') {
    actionsHTML = `
      <div class="card-msg">Saved to <code>public/library/${entry.id}/</code></div>
      <div class="abtn-row">
        <button class="abtn abtn-secondary" onclick="regenerate('${entry.id}')">↺ Regenerate</button>
        <a class="abtn abtn-secondary" style="text-align:center;text-decoration:none"
           href="/library/${entry.id}/embroidery.${manifest[entry.id]?.format || 'jef'}" download>
          ↓ Download
        </a>
      </div>
    `;
  }

  return `
    <div class="${cardClass}" id="card-${entry.id}">
      <div class="card-header">
        <div class="card-name">${icon} ${escHtml(entry.name)}</div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="card-desc">${escHtml(entry.description)}</div>
      <div class="card-preview">
        <div class="preview-half">${leftContent}</div>
        <div class="preview-half">${rightContent}</div>
      </div>
      <div class="card-meta">
        <span>📐 ${hoop.w}×${hoop.h} mm</span>
        <span>🎨 ${entry.settings.numColors} colors</span>
        <span>📏 ${entry.settings.densityMm} mm</span>
        <span>✏️ ${entry.settings.outline}</span>
      </div>
      <div class="card-actions">${actionsHTML}</div>
    </div>
  `;
}

function refreshCard(id) {
  const el = document.getElementById(`card-${id}`);
  const entry = CATALOG.find(e => e.id === id);
  if (el && entry) el.outerHTML = cardHTML(entry);
  updateStats();
}

// ─── Pipeline steps ───────────────────────────────────────────────────────────
async function runPipeline(id) {
  const entry = CATALOG.find(e => e.id === id);
  if (!entry) return;
  cardState[id] = { stage: 'generating', imageB64: null, result: null, error: null };
  refreshCard(id);

  // Step 1: Generate image
  let imageB64;
  try {
    const r = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: entry.prompt + `, bold vector sticker art style, flat colors, thick black outlines, no gradients, white background, exactly ${entry.settings.numColors} distinct fill colors, clean simple shapes, embroidery patch design` }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    imageB64 = data.imageBase64;
  } catch (e) {
    cardState[id] = { stage: 'error', imageB64: null, result: null, error: `Generate: ${e.message}` };
    refreshCard(id);
    return;
  }

  cardState[id] = { stage: 'converting', imageB64, result: null, error: null };
  refreshCard(id);

  // Step 2: Convert to stitches
  const hoop = HOOPS[entry.settings.hoopKey] || HOOPS['4x4'];
  let result;
  try {
    const r = await fetch('/api/image_to_jef', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64: imageB64,
        hoop_w_mm: hoop.w, hoop_h_mm: hoop.h,
        num_colors: entry.settings.numColors,
        density_mm: entry.settings.densityMm,
        fill_angle_deg: null,
        min_feature_mm: entry.settings.minFeatureMm,
        outline: entry.settings.outline,
        outline_width_mm: 1.0,
        format: 'jef',
        thread_brand: 'madeira',
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    result = data;
  } catch (e) {
    cardState[id] = { stage: 'error', imageB64, result: null, error: `Convert: ${e.message}` };
    refreshCard(id);
    return;
  }

  cardState[id] = { stage: 'ready', imageB64, result, error: null };
  refreshCard(id);
}

async function doSave(id) {
  const entry = CATALOG.find(e => e.id === id);
  const st = cardState[id];
  if (!entry || !st?.result) return;

  cardState[id] = { ...st, stage: 'saving' };
  refreshCard(id);

  try {
    const r = await fetch('/api/save_to_library', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: entry.id,
        name: entry.name,
        category: entry.category,
        description: entry.description,
        imageBase64: st.imageB64,
        previewSvg: st.result.previewSvg,
        jefBase64: st.result.jefBase64,
        format: 'jef',
        stitchCount: st.result.stitchCount,
        colors: st.result.colors,
        threads: st.result.threads,
      }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    manifest[id] = { id: entry.id, name: entry.name, category: entry.category,
                     description: entry.description, format: 'jef',
                     stitchCount: st.result.stitchCount };
    cardState[id] = { ...st, stage: 'saved' };
  } catch (e) {
    cardState[id] = { ...st, stage: 'error', error: `Save: ${e.message}` };
  }
  refreshCard(id);
}

function regenerate(id) {
  cardState[id] = { stage: 'idle', imageB64: null, result: null, error: null };
  refreshCard(id);
  runPipeline(id);
}

// ─── Batch queue ──────────────────────────────────────────────────────────────
function startAutoQueue() {
  const unsaved = CATALOG.filter(e =>
    cardState[e.id]?.stage !== 'saved' &&
    cardState[e.id]?.stage !== 'generating' &&
    cardState[e.id]?.stage !== 'converting'
  );
  if (!unsaved.length) { alert('All designs are already saved!'); return; }
  queue = unsaved.map(e => e.id);
  queueRunning = true;
  document.getElementById('btnAutoAll').style.display = 'none';
  document.getElementById('btnStopAll').style.display = '';
  document.getElementById('progressBar').style.display = '';
  updateQueueProgress();
  processQueue();
}

function stopQueue() {
  queueRunning = false;
  queue = [];
  document.getElementById('btnAutoAll').style.display = '';
  document.getElementById('btnStopAll').style.display = 'none';
  document.getElementById('progressBar').style.display = 'none';
}

function updateQueueProgress() {
  const total = CATALOG.length;
  const done  = CATALOG.filter(e => cardState[e.id]?.stage === 'saved').length;
  document.getElementById('progressFill').style.width = `${(done / total) * 100}%`;
}

async function processQueue() {
  while (queue.length > 0 && queueRunning) {
    const id = queue.shift();
    if (cardState[id]?.stage === 'saved') { updateQueueProgress(); continue; }
    await runPipeline(id);
    if (cardState[id]?.stage === 'ready') {
      await doSave(id);
    }
    updateQueueProgress();
  }
  if (!queue.length) stopQueue();
}

// ─── Util ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
