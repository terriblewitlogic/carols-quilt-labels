[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  targetPort = 5199
  port = 8888

# Python functions — declare each explicitly so Netlify uses Python 3.11
[functions."export"]
  runtime = "python3.11"

[functions."preview"]
  runtime = "python3.11"

[functions."font-samples"]
  runtime = "python3.11"

[functions."generate"]
  runtime = "python3.11"

[functions."image_to_jef"]
  runtime = "python3.11"

[functions."save_to_library"]
  runtime = "python3.11"
